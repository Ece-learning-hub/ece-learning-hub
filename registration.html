
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | ECE Learning Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #222;
        }

        header {
            background: linear-gradient(120deg, #172554, #4338a8);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .form-container {
            max-width: 500px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000018;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #bbb;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #4338a8;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 18px;
        }

        .home {
            display: block;
            text-align: center;
            margin: 20px;
            color: #4338a8;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Registration</h1>
    <p>Join ECE Learning Hub</p>
</header>

<div class="form-container">

    <h2>Register Here</h2>

    <form id="registrationForm">

        <label for="studentName">Full Name</label>
        <input type="text" id="studentName"
               placeholder="Enter your name" required>

        <label for="studentEmail">Email Address</label>
        <input type="email" id="studentEmail"
               placeholder="Enter your email" required>

        <label for="course">Select Course</label>
        <select id="course" required>
            <option value="">Choose a course</option>
            <option>Basic Electronics</option>
            <option>Electrical Basics</option>
            <option>Digital Electronics</option>
            <option>Communication Systems</option>
            <option>C Programming</option>
            <option>Python Programming</option>
            <option>AI & Machine Learning</option>
        </select>

        <button type="submit">Register Now</button>

    </form>

    <p id="message"></p>

    <a class="home" href="index.html">← Back to Home</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://iremwvswmqufwikotunp.supabase.co";
const SUPABASE_KEY = "sb_publishable_S8pDsx5Nc5ukjXuckoZSNg_s3RJU3Pk";

const database = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("registrationForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("studentName").value.trim();
    const email = document.getElementById("studentEmail").value.trim();
    const course = document.getElementById("course").value;
    const message = document.getElementById("message");

    message.innerText = "Submitting registration...";

    const { error } = await database
        .from("student_registrations")
        .insert({
            full_name: name,
            email: email,
            course: course
        });

    if (error) {
        console.error(error);
        message.innerText = "Registration failed. Please try again.";
    } else {
        message.innerText = "Registration successful! Welcome, " + name;
        document.getElementById("registrationForm").reset();
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
